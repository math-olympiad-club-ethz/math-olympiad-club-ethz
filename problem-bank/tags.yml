# tags.yml — the ONLY list of allowed tags of the Math Olympiad Club ETHZ problem bank.
#
# Adding a tag or an origin = one entry here (slug + name is enough; description and aliases are
# optional). Slugs are lowercase ASCII with hyphens and must be unique within their type.
#   area        what a problem is ABOUT (shown on the site). Tree of at most 3 levels; selecting a
#               node also matches every descendant.
#   methods     what a SOLUTION uses (hidden by default on the site: spoilers). Flat; "group" is
#               only for display.
#   difficulty  exactly easy / medium / hard / extreme (the rubric is in the descriptions).
#   origin      where a problem comes from (competition, book, journal, ...), with a kind.
# Aliases are lowercase search words that are never displayed.

