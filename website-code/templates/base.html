<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- What the pages may load (GitHub Pages cannot send headers): nothing from other sites. The engine worker is
         same-origin and brings its own policy; blob: frames and fetches are the PDFs made in the browser. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' blob:; worker-src 'self'; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page_title %}{{ page_title }} | {% endif %}Math Olympiad Club at ETHZ</title>
    <meta name="description" content="The Math Olympiad Club at ETH Zurich: weekly problem-solving sessions and a problem bank to make your own problem sets.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page_title %}{{ page_title }} | {% endif %}Math Olympiad Club at ETHZ">
    <meta property="og:description" content="Weekly problem-solving sessions and a problem bank to make your own problem sets.">
    <meta property="og:image" content="{{ site_url }}static/images/club_logo_preview_600.png">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon_dark.png') }}" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    {% set v = ('?v=' ~ asset_version) if asset_version else '' %}
    <link href="{{ url_for('static', filename='css/site.css') }}{{ v }}" rel="stylesheet">
    <!-- the web fonts' style sheet: fetched now, put to use by site.js once the page has been painted (see there); as it is
         without scripts.  The seal: a background in site.css, which the browser would find only after its first pass. -->
    <link rel="preload" href="{{ url_for('static', filename='css/fonts.css') }}{{ v }}" as="style">
    <noscript><link href="{{ url_for('static', filename='css/fonts.css') }}{{ v }}" rel="stylesheet"></noscript>
    <link rel="preload" href="{{ url_for('static', filename='images/club_logo_light_176.webp') }}?v=2" as="image" media="(prefers-color-scheme: light)">
    <link rel="preload" href="{{ url_for('static', filename='images/club_logo_dark_176.webp') }}?v=2" as="image" media="(prefers-color-scheme: dark)">
    <!-- theme (before the first paint), footer year. After the stylesheet: with a Content-Security-Policy in the page, the
         browser fetches nothing that follows a blocking script until the script has run, so the stylesheet would lose a round
         trip. Before the page's own scripts (the block below): on a slow connection they would share the line with the
         stylesheet and hold back the first paint; here they start once it has arrived, and are ready just as soon. -->
    <script src="{{ url_for('static', filename='js/site.js') }}{{ v }}"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-head">
        <div class="frame">
            <a class="brand" href="{{ url_for('home') }}" aria-label="Math Olympiad Club at ETHZ, home">
                <span class="club-logo" aria-hidden="true"></span>
            </a>
            <nav id="site-nav" class="site-nav" aria-label="Main">
                <ul>
                    <li><a href="{{ url_for('home') }}"{% if page == 'home' %} aria-current="page"{% endif %}>Home</a></li>
                    <li><a class="nav-cta" href="{{ url_for('problems') }}"{% if page == 'problems' %} aria-current="page"{% endif %}>Problems</a></li>
                    <li><a href="{{ url_for('propose') }}"{% if page == 'propose' %} aria-current="page"{% endif %}>Propose a problem</a></li>
                </ul>
            </nav>
            <button id="theme-toggle" class="theme" type="button"><span class="disc" aria-hidden="true"></span><span class="theme-label-light">Dark</span><span class="theme-label-dark">Light</span></button>
        </div>
    </header>

    <!-- everything but the header: what a pinch on a trackpad magnifies (site.js) -->
    <div class="page">
        <div class="shell">
            <main>
                <div class="frame"><div class="col">
                    {% block content %}{% endblock %}
                </div></div>
            </main>
        </div>

        <footer class="site-foot">
            <div class="frame">
                <div class="foot-row">
                    <span>© <span id="current-year">{{ year }}</span> Math Olympiad Club at ETHZ</span>
                    <a href="mailto:{{ club_email }}">{{ club_email }}</a>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
