<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- What the pages may load (GitHub Pages cannot send headers): nothing from other sites. The engine worker is
         same-origin and brings its own policy; blob: frames and fetches are the PDFs made in the browser. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' blob:; worker-src 'self'; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page_title %}{{ page_title }} | {% endif %}Math Olympiad Club at ETHZ</title>
    <meta name="description" content="The Math Olympiad Club at ETH Zurich: weekly problem-solving sessions and a problem bank to make your own problem sets.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page_title %}{{ page_title }} | {% endif %}Math Olympiad Club at ETHZ">
    <meta property="og:description" content="Weekly problem-solving sessions and a problem bank to make your own problem sets.">
    <meta property="og:image" content="https://math-olympiad-club-ethz.github.io/math-olympiad-club-ethz/static/images/club_logo_light_280.png">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon_dark.png') }}" media="(prefers-color-scheme: dark)">
    {% set v = ('?v=' ~ asset_version) if asset_version else '' %}
    <!-- theme (before the first paint), footer year -->
    <script src="{{ url_for('static', filename='js/site.js') }}{{ v }}"></script>
    <link href="{{ url_for('static', filename='css/site.css') }}{{ v }}" rel="stylesheet">
</head>
<body>
    <div class="shell">
        <header class="site-head">
            <div class="frame">
                <a class="brand" href="{{ url_for('home') }}">
                    <span class="club-logo" aria-hidden="true"></span>
                    <span>Math Olympiad Club at <span class="ac">ETHZ</span></span>
                </a>
                <nav id="site-nav" class="site-nav" aria-label="Main">
                    <ul>
                        <li><a href="{{ url_for('home') }}"{% if page == 'home' %} aria-current="page"{% endif %}>Home</a></li>
                        <li><a href="{{ url_for('problems') }}"{% if page == 'problems' %} aria-current="page"{% endif %}>Problems</a></li>
                        <li><a href="{{ url_for('propose') }}"{% if page == 'propose' %} aria-current="page"{% endif %}>Propose a problem</a></li>
                    </ul>
                </nav>
                <button id="theme-toggle" class="theme" type="button"><span class="disc" aria-hidden="true"></span><span class="theme-label-light">Dark</span><span class="theme-label-dark">Light</span></button>
            </div>
        </header>

        <main>
            <div class="frame"><div class="col">
                {% block content %}{% endblock %}
            </div></div>
        </main>
    </div>

    <footer class="site-foot">
        <div class="frame">
            <div class="foot-row">
                <span>© <span id="current-year"></span> Math Olympiad Club at <span class="ac">ETHZ</span></span>
                <a href="mailto:olympiadclub@math.ethz.ch">olympiadclub@math.ethz.ch</a>
            </div>
        </div>
    </footer>
</body>
</html>
