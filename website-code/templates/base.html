<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- What the pages may load (GitHub Pages cannot send headers). The engine worker is same-origin and brings its own
         policy; blob: frames and fetches are the PDFs made in the browser. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/; style-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/ 'unsafe-inline'; img-src 'self' data:; connect-src 'self' blob:; worker-src 'self'; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page_title %}{{ page_title }} | {% endif %}Math Olympiad Club at ETHZ</title>
    <meta name="description" content="The Math Olympiad Club at ETH Zurich: weekly problem-solving sessions and a problem bank to make your own problem sets.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page_title %}{{ page_title }} | {% endif %}Math Olympiad Club at ETHZ">
    <meta property="og:description" content="Weekly problem-solving sessions and a problem bank to make your own problem sets.">
    <meta property="og:image" content="https://math-olympiad-club-ethz.github.io/math-olympiad-club-ethz/static/images/club_logo_light_280.png">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon_dark.png') }}" media="(prefers-color-scheme: dark)">
    {% set v = ('?v=' ~ asset_version) if asset_version else '' %}
    <!-- theme (before the first paint), footer year -->
    <script src="{{ url_for('static', filename='js/site.js') }}{{ v }}"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/custom.css') }}{{ v }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <span class="navbar-brand">
                <span class="club-logo" aria-hidden="true"></span>
                <span class="navbar-brand-text">Math Olympiad Club at ETHZ</span>
            </span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <button id="theme-toggle" class="btn btn-outline-secondary ms-2 order-lg-last" type="button"><span class="theme-label-light">Dark</span><span class="theme-label-dark">Light</span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link{% if page == 'home' %} active{% endif %}" href="{{ url_for('home') }}"{% if page == 'home' %} aria-current="page"{% endif %}>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if page == 'problems' %} active{% endif %}" href="{{ url_for('problems') }}"{% if page == 'problems' %} aria-current="page"{% endif %}>Problems</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if page == 'propose' %} active{% endif %}" href="{{ url_for('propose') }}"{% if page == 'propose' %} aria-current="page"{% endif %}>Propose a problem</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4 mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-3 bg-body-tertiary">
        <div class="container text-center">
            <span class="text-muted">© <span id="current-year"></span> Math Olympiad Club at ETHZ</span>
        </div>
    </footer>

    <!-- Bootstrap JS (only the mobile menu uses it): async, so the page never waits for the CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" async></script>
</body>
</html>
